name: Bug Report
description: Report a bug or unexpected behavior in assistit.nvim
title: "[Bug]: "
labels: ["bug"]
body:
  - type: textarea
    id: summary
    attributes:
      label: What happened?
      description: Concise description of the issue.
    validations:
      required: true
  - type: textarea
    id: repro
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Configure assistit.nvim with ...
        2. Open a Lua file and type ...
        3. Observe ...
    validations:
      required: true
  - type: textarea
    id: health
    attributes:
      label: Output of `:checkhealth assistit` and `:AssistItStatus`
      render: text
    validations:
      required: true
  - type: input
    id: env
    attributes:
      label: Environment (Neovim version, OS, local inference server & model)
      placeholder: "NVIM v0.10.4, Debian 12, llama-server b4500, qwen2.5-coder-0.5b-q4_k_m"
    validations:
      required: true
